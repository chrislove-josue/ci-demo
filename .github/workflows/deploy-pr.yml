name: Deploy PR sur VM tdsdev

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm install
        run: npm install

      - name: npm run build
        run: npm run build

      - name: Deploy vers la VM
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          VM_HOST: 102.215.93.128
          VM_USER: tdsdev
          DEPLOY_PATH: /var/www/ci-demo/pr-${{ github.event.pull_request.number }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            $VM_USER@$VM_HOST \
            "mkdir -p $DEPLOY_PATH"

          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -r dist/* \
            $VM_USER@$VM_HOST:$DEPLOY_PATH

          echo "✅ Déployé sur http://$VM_HOST/ci-demo/pr-${{ github.event.pull_request.number }}/"

      - name: Commentaire sur la PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const host = '102.215.93.128';
            github.rest.issues.createComment({
              issue_number: pr,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview déployée !**\n\nURL : http://${host}/ci-demo/pr-${pr}/\n\n_Déploiement automatique via GitHub Actions_`
            });

